name: btc-macro-etl

on:
  schedule:
    - cron: "0 22 * * *"      # 22:00 UTC daily — after US close
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m src.pipeline

      - name: Commit data snapshots
        run: |
          git config user.name  "btc-macro-bot"
          git config user.email "btc-macro-bot@users.noreply.github.com"
          git add data/*.parquet data/summary.json || true
          git diff --cached --quiet || git commit -m "etl: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push || true
